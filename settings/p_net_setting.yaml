num_nodes: 100
save_dir: dataset\p_net
topology:
  # file_path: './dataset/topology/Geant.gml'
  type: waxman
  wm_alpha: 0.4
  wm_beta: 0.4
  num_edges: 400
link_attrs_setting:
  - name: bw
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
    owner: link
    type: resource
    constraints: le
  - name: max_bw
    originator: bw
    owner: link
    type: extrema # 极值
  - name: security
    distribution: uniform
    dtype: int
    generative: true
    high: 3
    low: 1
    owner: link
    type: security
    constraints: le
#  - name: max_security
#    originator: security
#    owner: link
#    type: extrema # 极值


node_attrs_setting:
  - name: cpu
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
    owner: node
    type: resource
    constraints: le
  - name: max_cpu
    originator: cpu
    owner: node
    type: extrema
  - name: mem
    distribution: uniform
    dtype: int
    generative: true
    high: 100
    low: 50
    owner: node
    type: resource
    constraints: le
  - name: max_mem
    originator: mem
    owner: node
    type: extrema
  - name: security
    distribution: uniform
    dtype: int
    generative: true
    high: 6
    low: 1
    owner: node
    type: security
    constraints: le
#  - name: max_security
#    originator: security
#    owner: node
#    type: extrema



file_name: p_net.gml
